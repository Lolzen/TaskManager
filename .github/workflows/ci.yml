name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pip:
    name: pip / Python ${{ matrix.python }} / ${{ matrix.binding }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.13"]
        binding: [pyside6, pyqt6]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install
        run: pip install .[test] PyQt6
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
          TASKMANAGER_QT: ${{ matrix.binding }}
        run: python -m pytest -q

  ubuntu:
    name: Ubuntu 24.04 (.deb)
    runs-on: ubuntu-24.04
    container: ubuntu:24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build, install and test the .deb
        run: packaging/scripts/build-deb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: dist/*.deb

  arch:
    name: Arch Linux (makepkg)
    runs-on: ubuntu-24.04
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v4
      - name: Build, install and test the package
        run: packaging/scripts/build-arch.sh
      - uses: actions/upload-artifact@v4
        with:
          name: arch
          path: dist/*.pkg.tar.zst

  void:
    name: Void Linux (xbps-src)
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/void-linux/void-glibc-full:latest
      options: --privileged
      volumes:
        - /dev:/dev
    steps:
      - name: Prepare container
        # actions/checkout needs these before the repository is available
        run: xbps-install -Syu xbps && xbps-install -yu && xbps-install -y bash git
      - uses: actions/checkout@v4
      - name: Build, install and test the package
        run: packaging/scripts/build-void.sh
      - uses: actions/upload-artifact@v4
        with:
          name: void
          path: dist/*.xbps

  appimage:
    name: AppImage (build)
    runs-on: ubuntu-24.04
    container: ubuntu:22.04
    steps:
      - uses: actions/checkout@v4
      - name: Build the AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: packaging/appimage/build-appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: dist/*.AppImage

  appimage-test:
    name: AppImage on ${{ matrix.image }}
    needs: appimage
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        image:
          - ubuntu:22.04
          - ubuntu:24.04
          - debian:12
          - fedora:latest
          - archlinux:latest
          - ghcr.io/void-linux/void-glibc-full:latest
    steps:
      - name: Prepare container
        # actions/checkout needs tar (and git, if present) to be usable
        run: |
          if command -v xbps-install >/dev/null; then xbps-install -Syu xbps && xbps-install -yu && xbps-install -y bash tar; fi
          if command -v dnf >/dev/null; then dnf install -y -q tar; fi
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: appimage
          path: dist
      - name: Run the AppImage
        run: |
          chmod +x dist/*.AppImage
          sh packaging/appimage/test-appimage.sh dist/*.AppImage

  release:
    name: Attach packages to the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ubuntu, arch, void, appimage-test]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
